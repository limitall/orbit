<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Jamnagar — Babylon.js</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        font: 13px/1.4 system-ui, sans-serif; color: #e6e8eb;
        background: rgba(20,24,30,0.72); padding: 10px 14px; border-radius: 8px;
        backdrop-filter: blur(6px); pointer-events: none; max-width: 260px;
      }
      #hud b { color: #fff; }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        z-index: 20; color: #cfd3d8; font: 15px system-ui, sans-serif; background: #0b0d10;
      }
      #floors {
        position: fixed; top: 12px; right: 12px; z-index: 10;
        font: 13px/1.2 system-ui, sans-serif; color: #e6e8eb;
        background: rgba(20,24,30,0.72); padding: 10px; border-radius: 8px;
        backdrop-filter: blur(6px); display: none; width: 132px;
      }
      #floors .title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #9aa1ab; margin-bottom: 8px; }
      #floors button {
        display: block; width: 100%; margin: 0 0 5px; padding: 6px 9px; text-align: left;
        font: 13px system-ui, sans-serif; color: #e6e8eb; cursor: pointer;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
        border-radius: 6px; transition: background .12s, border-color .12s;
      }
      #floors button:hover { background: rgba(255,255,255,0.13); }
      #floors button.active { background: #2d6cff; border-color: #2d6cff; color: #fff; }
      #floors .sep { height: 1px; background: rgba(255,255,255,0.10); margin: 7px 0; }
      #floors label { display: flex; align-items: center; gap: 7px; padding: 4px 2px; cursor: pointer; user-select: none; }
      #floors label input { accent-color: #2d6cff; }
    </style>
  </head>
  <body>
    <div id="loading">Loading building model…</div>
    <div id="hud" style="display:none">
      <b>Orbit Jamnagar</b><br />
      <span id="stats"></span><br />
      Drag to orbit · scroll to zoom
    </div>
    <div id="floors"></div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
